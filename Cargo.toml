[workspace]
resolver = "2"
members = [
    "crates/clv-core",
    "crates/clv-platform",
    "crates/clv-app",
]

[workspace.package]
version = "1.2.1"
edition = "2024"
license = "MIT"
authors = ["Sopaco"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
open = "5"
thiserror = "2"
tracing = { version = "0.1", features = ["release_max_level_warn"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
sys-locale = "0.3"
rfd = "0.15"
tray-icon = "0.19"
muda = "0.15"

gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
