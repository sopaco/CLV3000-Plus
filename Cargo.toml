[workspace]
resolver = "2"
members = [
    "crates/clv-core",
    "crates/clv-platform",
    "crates/clv-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["CLV3000 Plus"]

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
open = "5"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
